stages:
  - check
  - publish
  - deploy
  - mirror

checks:
  stage: check
  variables:
    UV_FROZEN: "true"
  script:
    - uv run poe checks
    - uv run pytest --junitxml=junit.xml
    - uv run poe cover
    - uv run coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
build:
  stage: publish
  script:
    - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    - docker build -t public.ecr.aws/y1d2j6a8/ems-analyst-model .
    - docker push public.ecr.aws/y1d2j6a8/ems-analyst-model

deploy:
  # Same loop as ems-analyst: gitlab-runner on the box pulls source,
  # rebuilds image, force-recreates the scheduler container. Scheduler
  # is `schedule.every().day.at(02:00 CT)` so a gridstatus 403 (live
  # until ~2026-06-01) only fails once a day → container restarts via
  # `restart: unless-stopped` → idle until next 02:00. No tight loop.
  stage: deploy
  only: [main]
  needs: [checks]
  script:
    - cd /home/admin/arcnode/ems-analyst-model && git pull --ff-only && cd /home/admin/docker/ems-analyst-model && docker compose up -d --build --force-recreate

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/ems-analyst-model.git
  only:
    - main
