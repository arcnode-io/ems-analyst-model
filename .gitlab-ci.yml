stages:
  - check
  - publish
  - deploy
  - mirror

checks:
  stage: check
  variables:
    UV_FROZEN: "true"
  script:
    - uv run poe checks
    - uv run pytest --junitxml=junit.xml
    - uv run poe cover
    - uv run coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
build:
  stage: publish
  script:
    - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    - docker build -t public.ecr.aws/y1d2j6a8/ems-analyst-model .
    - docker push public.ecr.aws/y1d2j6a8/ems-analyst-model

deploy:
  # Build-only until June 1: gridstatus tier is 403 on ercot queries, so
  # running the scheduler now would crash-loop nightly at 02:00 CT.
  # Image stays fresh; flip to `up -d --build --force-recreate` on the
  # day the tier opens.
  stage: deploy
  only: [main]
  needs: [checks]
  script:
    - cd /home/admin/arcnode/ems-analyst-model && git pull --ff-only && cd /home/admin/docker/ems-analyst-model && docker compose build

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/ems-analyst-model.git
  only:
    - main
