[project]
name = "ems-analyst-model"
version = "1.0.0-beta"
requires-python = ">=3.13.2"
dependencies = [
    "beartype>=0.19",
    "gitpython>=3.1.50",
    "mako>=1.3.12",
    "matplotlib>=3.9.0",
    "mlflow>=3.0",
    "numpy>=2.0.0",
    "pandera[polars]>=0.22.0",
    "pandas>=2.2.0",
    "polars>=1.31.0",
    "prometheus-client>=0.22.0",
    "prophet>=1.1.7",
    "psycopg2-binary>=2.9.10",
    "pyarrow>=20.0.0",
    "pydantic>=2.9.2",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
    "schedule>=1.2.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.0",
    "urllib3>=2.7.0",
    "xgboost>=2.1.0",
    "httpx>=0.28.1",
    "boto3>=1.43.9",
    "lightgbm>=4.5.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "black>=26.3.1",
    "deptry>=0.23.0",
    "pandas-stubs>=3.0",
    "pip>=26.1",
    "pip-audit>=2.6.1",
    "poethepoet>=0.32.0",
    "pook>=2.1.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
    "testcontainers[postgres]>=4.12.0",
    "ty>=0.0.18",
    "types-pyyaml>=6.0",
    "types-requests>=2.32",
]

[tool.poe.tasks]
depcheck = "deptry ."
format = "black ."
lint = "ruff check"
typecheck = "ty check"
audit-src = "bandit -r src/* -s B101"
# Reason: two transitive advisories with no reachable fix —
#   PYSEC-2026-3552  cryptography <50 PKCS#7 oracle; mlflow's google-auth chain caps <50.
#                    Not in our path (no S/MIME EnvelopedData decryption service). Drop when mlflow relaxes.
#   CVE-2026-71211   mlflow AI Gateway SSRF; no fixed release. We use mlflow tracking only, not the gateway.
audit-packages = "pip-audit --ignore-vuln PYSEC-2026-3552 --ignore-vuln CVE-2026-71211"
security = ["audit-src", "audit-packages"]
checks = ["depcheck", "format", "lint", "typecheck", "security"]
healthcheck = "bash -c 'curl -sf -o /dev/null -w \"CoinGecko: %{http_code}\\n\" https://api.coingecko.com/api/v3/ping && echo APIS_READY'"
unit = "pytest -vv src/*"
integration = "pytest -vv -p no:warnings tests/*"
cover = "pytest -vv --cov=src -p no:warnings src/*"
test = ["unit", "healthcheck", "integration"]
review = "claude 'run code-reviewer agent against diff for quality and elegance'"
commit = "bash -c 'uv run poe checks && uv run poe test && uv run poe review && git add -A && git cz && git push'"

[tool.coverage.run]
omit = ["*/test_*.py", "tests/*"]

[tool.deptry.per_rule_ignores]
DEP002 = ["boto3", "gitpython", "mako", "numpy", "pyarrow", "urllib3"]
# Reason: test files colocated in src/ pull dev-only deps. Mirrors the
# ems-analyst agent repo's convention (DEP004 for pytest/pook/psycopg2).
DEP004 = ["pytest"]

[tool.uv]
constraint-dependencies = [
    # Reason: force fixes for CVEs that transitive deps otherwise pin low.
    "starlette>=1.3.1",       # PYSEC-2026-161 / 248 / 249
    "cryptography>=49.0.0",   # PYSEC-2026-3553/3554 (50.x is capped by mlflow's google-auth chain — see audit-packages ignore)
]
